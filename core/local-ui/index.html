<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan 本地控制台</title>
<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:760px;margin:40px auto;padding:0 18px;color:#202124;background:#f6f7f9}main{background:#fff;border:1px solid #ddd;border-radius:8px;padding:22px}h1{font-size:22px;margin-top:0}#log{min-height:280px;max-height:55vh;overflow:auto;border:1px solid #ddd;padding:12px;white-space:pre-wrap;background:#fafafa}.row{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:11px;border:1px solid #aaa;border-radius:5px;font-size:16px}button{padding:10px 18px;border:0;border-radius:5px;background:#1769e0;color:#fff;font-size:16px;cursor:pointer}</style></head>
<body><main><h1>Plan 本地控制台</h1><div id="log">本地控制台已连接。输入指令后按回车或点击发送。</div><div class="row"><input id="text" autofocus placeholder="例如：帮助"><button id="send">发送</button></div></main>
<script>const log=document.querySelector('#log'),input=document.querySelector('#text'),button=document.querySelector('#send'),token='__MASHIRO_TOKEN__';const add=(who,text)=>{log.textContent+=`\n\n${who}: ${text}`;log.scrollTop=log.scrollHeight};const addImages=paths=>{for(const file of paths||[]){const img=document.createElement('img');img.src='/media?path='+encodeURIComponent(file)+'&token='+encodeURIComponent(token);img.alt='Plan 返回图片';img.style='display:block;max-width:100%;margin:12px 0;border:1px solid #ddd';img.onerror=()=>img.replaceWith(document.createTextNode('图片加载失败：'+file));log.appendChild(img)}};async function send(){const text=input.value.trim();if(!text)return;input.value='';add('我',text);button.disabled=true;try{const r=await fetch('/api/command',{method:'POST',headers:{'content-type':'application/json','x-mashiro-token':token},body:JSON.stringify({text})});const d=await r.json();add('Plan',d.reply||'');addImages(d.mediaPaths);}catch(e){add('错误',e.message)}finally{button.disabled=false;input.focus()}}button.onclick=send;input.onkeydown=e=>{if(e.key==='Enter')send()};</script></body></html>
